version: "3.9"
services:
  backend:
    build: ./backend_files
    container_name: superkart_backend
    ports:
      - "7860:7860"
    networks:
      - superkart_net
  frontend:
    build: ./frontend_files
    container_name: superkart_frontend
    environment:
      - BACKEND_URL=http://backend:7860
    ports:
      - "8501:8501"
    depends_on:
      - backend
    networks:
      - superkart_net
networks:
  superkart_net:
    driver: bridge
